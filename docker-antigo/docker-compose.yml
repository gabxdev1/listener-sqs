services:

  api:
    image: gabxdevv/listener-sqs:1.6.3
    container_name: listener-sqs-api-2
    environment:
      - JAVA_TOOL_OPTIONS=-javaagent:/app/dd-java-agent.jar
      - DD_AGENT_HOST=host.docker.internal
      - AWS_ACCESS_KEY_ID=
      - AWS_SECRET_ACCESS_KEY=
      - AWS_REGION=sa-east-1
      - AWS_DEFAULT_REGION=sa-east-1
      - SERVER_PORT=8080
      - DD_SERVICE=listener-sqs
      - DD_ENV=dev
      - DD_VERSION=1.0.0
      - DD_TRACE_AGENT_PORT=8126
      - DD_LOGS_INJECTION=true
      - DD_PROFILING_ENABLED=true
      - DD_PROFILING_ALLOCATION_ENABLED=true
      - DD_PROFILING_EXCEPTION_ENABLED=true
      - DD_LOGS_CONFIG_AUTO_MULTI_LINE_DETECTION=true
      - DD_ANALYTICS_ENABLED=true
      - DDD_TRACE_SAMPLING_RULES=[{"sample_rate":1.0}]
      - DD_TRACE_SAMPLE_RATE=1.0
      - DD_TRACE_RATE_LIMIT=100000
      - DD_TRACE_AGENT_MAX_PAYLOAD_SIZE=10485760
      - STATSD_ENABLED=true
    ports:
      - "8080:8080"








